name: Bug report (English)
description: Report a problem with SephiriaEnhancements.
body:
  - type: markdown
    attributes:
      value: |
        Search [existing issues](https://github.com/0xMashiro/SephiriaEnhancements/issues) first and add details there if the same problem has been reported.
        In the Mod settings, choose **About and Updates → Open Mod log folder** to find your logs.
        If the game or Mod cannot start, see [Feedback](https://github.com/0xMashiro/SephiriaEnhancements/blob/HEAD/README.md#feedback) for file locations.
        Missing logs or an intermittent problem should not prevent you from reporting. Write "unknown" where necessary.
  - type: input
    id: versions
    attributes:
      label: Game and Mod versions
      description: Include whether the Mod is a release or development build.
      placeholder: "Game version / Mod version / release or development"
    validations:
      required: true
  - type: dropdown
    id: play-mode
    attributes:
      label: Play mode and your role
      options:
        - Solo
        - Co-op host
        - Co-op client
        - Before entering a game / not applicable
        - Unknown
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Which feature or button did you use, what did you do, and what happened? Include any error text. Mention whether it happens every time. Other mods, relevant settings and other players' versions help if known.
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Logs, screenshots or video
      description: |
        Use **Open Mod log folder** in the settings, attach the support*.log files here directly. Logs are optional; screenshots or video also help.
        For loading failures or crashes, also attach Player.log from `%USERPROFILE%\AppData\LocalLow\TEAMHORAY\Sephiria`, plus Player-prev.log if you restarted after the problem.
        Copy logs before restarting again. Remove private information before uploading; attachments are public. If logs are unavailable, say so. Do not upload game files or your entire save folder.
