name: 问题反馈（中文）
description: 报告 SephiriaEnhancements 的功能故障。
body:
  - type: markdown
    attributes:
      value: |
        请先搜索[已有 Issue](https://github.com/0xMashiro/SephiriaEnhancements/issues)，相同问题可以直接在原帖补充。
        在 Mod 设置中选择**关于与更新 → 打开 Mod 日志文件夹**即可找到日志。
        如果游戏或 Mod 无法启动，请参阅[问题反馈](https://github.com/0xMashiro/SephiriaEnhancements/blob/HEAD/README.zh-CN.md#问题反馈)中的文件位置。
        找不到日志或无法稳定复现也可以反馈；不清楚的内容请填写“不确定”。
  - type: input
    id: versions
    attributes:
      label: 游戏和 Mod 版本
      description: 请同时说明 Mod 是普通版还是开发版。
      placeholder: 游戏版本 / Mod 版本 / 普通版或开发版
    validations:
      required: true
  - type: dropdown
    id: play-mode
    attributes:
      label: 游戏模式与自己的身份
      options:
        - 单人
        - 联机房主
        - 联机客户端
        - 尚未进入游戏 / 不适用
        - 不确定
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 遇到了什么问题？
      description: 使用了哪个功能或按钮，做了什么操作，之后发生了什么？请附上错误提示，并说明是否每次都会发生。若知道，也可补充其他 Mod、相关设置及其他玩家的版本。
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: 日志、截图或视频
      description: |
        在设置中选择**打开 Mod 日志文件夹**，将其中的 support*.log 文件直接附在这里。日志不是必填项，也欢迎提供截图或视频。
        加载失败或崩溃时，一并提供 `%USERPROFILE%\AppData\LocalLow\TEAMHORAY\Sephiria` 中的 Player.log；问题发生后已重启过游戏时，还请附上 Player-prev.log。
        请在再次重启前复制日志。附件会公开显示，上传前请移除私人信息；找不到日志时请直接说明。无需上传游戏文件或整个存档目录。
