name: 问题反馈（中文）
description: 报告 SephiriaEnhancements 的功能故障。
body:
  - type: markdown
    attributes:
      value: |
        请先搜索[已有 Issue](https://github.com/0xMashiro/SephiriaEnhancements/issues)，相同问题可以直接在原帖补充。
        参阅[日志位置与附件说明](https://github.com/0xMashiro/SephiriaEnhancements/blob/HEAD/README.zh-CN.md#查找并附上日志windows)。
        找不到日志或无法稳定复现也可以反馈；不清楚的内容请填写“不确定”。
  - type: input
    id: versions
    attributes:
      label: 游戏和 Mod 版本
      description: 请同时说明 Mod 是普通版还是开发版。
      placeholder: 游戏版本 / Mod 版本 / 普通版或开发版
    validations:
      required: true
  - type: dropdown
    id: play-mode
    attributes:
      label: 游戏模式与自己的身份
      options:
        - 单人
        - 联机房主
        - 联机客户端
        - 尚未进入游戏 / 不适用
        - 不确定
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 设置与运行环境
      description: 请说明操作系统、游戏语言、键鼠或手柄、相关 Mod 设置，以及其他已安装 Mod（没有则填“无”）。联机时请补充玩家人数，如已知，也请提供其他玩家的 Mod 版本。
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 说明具体操作与发生频率。如果只发生过一次，请描述问题发生前做了什么。
      placeholder: |
        1.
        2.
        发生频率：
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 预期表现与实际表现
      description: 说明预期发生什么、实际发生什么；若有屏幕上的错误提示，请一并提供。
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: 日志、截图或视频
      description: |
        将系统“文档” → `Saved Games\Sephiria\Mods\SephiriaEnhancements\Logs\Support` 中现有的 support*.log 压缩为 ZIP 并作为附件上传。
        加载失败或崩溃时，一并提供 `%USERPROFILE%\AppData\LocalLow\TEAMHORAY\Sephiria` 中的 Player.log；问题发生后已重启过游戏时，还请附上 Player-prev.log。
        请在再次重启前复制日志。附件会公开显示，上传前请移除私人信息；找不到日志时请直接说明。无需上传游戏文件或整个存档目录。
